name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # AGENTS.md: package-lock.json is the only lockfile. A stray pnpm-lock.yaml
      # makes Vercel install with pnpm against a file npm never updates, which
      # failed the deploy while this job stayed green. It came back once already.
      - name: package-lock.json is the only lockfile
        run: |
          stray=$(git ls-files pnpm-lock.yaml yarn.lock bun.lockb bun.lock)
          if [ -n "$stray" ]; then
            for f in $stray; do echo "::error file=$f::Second lockfile. npm is the package manager; delete it."; done
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test

      # docs/TYPE_REFERENCE.md is generated, and AGENTS.md makes regenerating it
      # after a declaration change an invariant. Nothing enforced that, so it had
      # already drifted. Regenerate and fail if the tree moved.
      - name: docs/TYPE_REFERENCE.md is up to date
        run: |
          npm run docs:types
          if ! git diff --quiet -- docs/TYPE_REFERENCE.md; then
            echo "::error file=docs/TYPE_REFERENCE.md::Out of date. Run 'npm run docs:types' and commit the result."
            git diff --stat -- docs/TYPE_REFERENCE.md
            exit 1
          fi
