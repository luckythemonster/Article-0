<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Zero: Era 1</title>
    <!--
      Favicons live in `public/` and are referenced relatively, because
      vite.config.ts sets `base: "./"` — a root-absolute `/favicon.ico` would
      break the moment this is served from anywhere but a domain root.
      The generator's `favicon.svg` is deliberately not shipped: it carries no
      vector data at all, just two 1000x1000 PNGs base64'd into an <svg>, at
      3.7 MB — twice the whole game bundle, for a 16px tab icon. The .ico and
      the 96px PNG cover every browser.
    -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#05070a" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070a;
        overflow: hidden;
        font-family: "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        width: 92vw;
        height: 92vh;
        max-width: 1280px;
        max-height: 800px;
      }
      /* Keep the pixel art crisp when the canvas is scaled up. */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* DOM overlay mount point for Arwes-rendered UI (e.g. CodecScene). */
      #codec-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      #codec-root:not(:empty) {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="codec-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
