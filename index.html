<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Zero: Era 1</title>
    <!--
      Favicons live in `public/` and are referenced relatively, because
      vite.config.ts sets `base: "./"` — a root-absolute `/favicon.ico` would
      break the moment this is served from anywhere but a domain root.
      `favicon.svg` is hand-drawn vector (see the file); the generator's own was
      a 3.7 MB <svg> wrapping two copies of the same PNG.
    -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#05070a" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070a;
        overflow: hidden;
        font-family: "Share Tech Mono", "Article Zero Symbols", "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /*
        A pre-script fallback only: `fitGameElement()` in src/main.ts overrides
        both dimensions with whole-pixel values as soon as it runs, and keeps
        doing so on resize. `92vw` is fractional on most windows, and a canvas
        with a fractional CSS size gets rescaled by the browser — which, with
        `image-rendering: pixelated` below, resamples every glyph in the HUD.
        Don't drop the inline sizing and rely on these.
      */
      #game {
        width: 92vw;
        height: 92vh;
        max-width: 1280px;
        max-height: 800px;
      }
      /* Keep the pixel art crisp when the canvas is scaled up. */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* DOM overlay mount point for Arwes-rendered UI (e.g. CodecScene). */
      #codec-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      #codec-root:not(:empty) {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="codec-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
